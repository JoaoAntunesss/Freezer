name: Publicar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Configuração do Firebase (segredo GOOGLE_SERVICES_JSON)
        env: { GSJ: '${{ secrets.GOOGLE_SERVICES_JSON }}' }
        run: |
          if [ -z "$GSJ" ]; then echo "Falta o segredo GOOGLE_SERVICES_JSON"; exit 1; fi
          printf '%s' "$GSJ" > app/google-services.json
      - name: Chave de assinatura fixa (segredos KEYSTORE_B64, KEYSTORE_PASS, KEY_ALIAS)
        env:
          KB64: '${{ secrets.KEYSTORE_B64 }}'
          KPASS: '${{ secrets.KEYSTORE_PASS }}'
          KALIAS: '${{ secrets.KEY_ALIAS }}'
        run: |
          if [ -z "$KB64" ]; then echo "Falta o segredo KEYSTORE_B64"; exit 1; fi
          echo "$KB64" | base64 -d > "$RUNNER_TEMP/freezer.jks"
          { echo "CI_KEYSTORE=$RUNNER_TEMP/freezer.jks"; echo "CI_KS_PASS=$KPASS"; echo "CI_KEY_ALIAS=$KALIAS"; } >> "$GITHUB_ENV"
      - name: Compilar
        env: { GROQ_API_KEY: '${{ secrets.GROQ_API_KEY }}' }
        run: |
          sed -i 's/\r$//' gradlew && chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Publicar o Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          VERSAO=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk freezer.apk
          NOTAS=$(git log -1 --format=%s)
          python3 -c "import json,os,sys; json.dump({'versao':sys.argv[1],'notas':sys.argv[2],'apk':'freezer.apk','tamanho':os.path.getsize('freezer.apk')}, open('versao.json','w'), ensure_ascii=False)" "$VERSAO" "$NOTAS"
          if gh release view "v$VERSAO" >/dev/null 2>&1; then
            gh release upload "v$VERSAO" freezer.apk versao.json --clobber
          else
            gh release create "v$VERSAO" freezer.apk versao.json --title "Freezer $VERSAO" --notes "$NOTAS" --latest
          fi
      - uses: actions/upload-artifact@v4
        with: { name: freezer-apk, path: freezer.apk }
